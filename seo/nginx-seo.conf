# Reglages SEO a appliquer dans la configuration Nginx de naatalstudio.com.
# A relire avec la configuration du serveur, puis tester avec `nginx -t`.

# 1. Compression (bloc http ou server principal)
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain text/markdown application/xml;

# 2. Redirection de www vers le domaine principal
# Reprendre les chemins ssl_certificate du bloc existant.
server {
    listen 443 ssl;
    server_name www.naatalstudio.com;
    # ssl_certificate ...;
    # ssl_certificate_key ...;
    return 301 https://naatalstudio.com$request_uri;
}

